[package]
name = "launcher"
version.workspace = true
edition.workspace = true

[[bin]]
name = "launcher"
path = "src/main.rs"

[[bin]]
name = "release"
path = "src/bin/release.rs"

[dependencies]
ed25519-dalek = "3.0.0"
eframe = "0.36"
env_logger = "0.11.11"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.4.2"
