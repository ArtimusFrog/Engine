[package]
name = "engine"
version.workspace = true
edition.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
env_logger = "0.11.11"
glam = "0.33.9"
gltf = { version = "1.4.1", features = ["KHR_materials_emissive_strength"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
kira = { version = "0.12.4", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "flac"] }
log = "0.4.34"
pollster = "1.0.1"
rapier3d = "0.35.3"
renet = "2.0.0"
renet_netcode = "2.0.0"
wgpu = "30.0.1"
winit = "0.30.13"
